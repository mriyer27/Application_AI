[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
description = "Local-first, human-supervised AI job application agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - personal use" }
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "typer>=0.12,<1",
    "rich>=13,<16",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "reportlab>=4.0,<6",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "Jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1,<3",
    "APScheduler>=3.10,<4",
]

[project.optional-dependencies]
browser = ["playwright>=1.44,<2"]
gmail = [
    "google-api-python-client>=2.100,<3",
    "google-auth>=2.25,<3",
    "google-auth-oauthlib>=1.2,<2",
    "google-auth-httplib2>=0.2,<1",
]
dev = ["pytest>=8,<10", "pytest-cov>=5", "respx>=0.21,<1"]
all = ["job-agent[browser,gmail,dev]"]

[project.scripts]
job-agent = "job_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_agent = ["dashboard/templates/*.html", "dashboard/static/*", "database/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network and not ollama'"
markers = [
    "network: test performs real network access (deselect with -m 'not network')",
    "browser: test launches a real local browser via Playwright",
    "ollama: test requires a running local Ollama server",
]
filterwarnings = ["ignore::DeprecationWarning:google.*"]
